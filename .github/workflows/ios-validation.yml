name: Katheko iOS validation
on:
  push:
    branches: [codex/katheko-v2-ios-validation]
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native iPhone and iPad app
        run: xcodebuild -project ios/KathekoV2.xcodeproj -scheme KathekoV2 -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Check the shared JavaScriptCore calculations
        run: swift ios/core-check.swift ios/KathekoV2/v2-core.js
      - name: Launch the iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for a in d["devices"].values() for x in a if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/KathekoV2.app
          xcrun simctl launch "$DEVICE" com.malavbadrakiya.KathekoV2
          sleep 5
          xcrun simctl io "$DEVICE" screenshot simulator-launch.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep com.malavbadrakiya.KathekoV2
      - uses: actions/upload-artifact@v4
        with:
          name: KathekoV2-Simulator
          path: build/Build/Products/Debug-iphonesimulator/KathekoV2.app
      - uses: actions/upload-artifact@v4
        with:
          name: KathekoV2-Launch
          path: simulator-launch.png

