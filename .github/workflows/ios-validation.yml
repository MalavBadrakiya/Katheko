name: Katheko iOS validation
on:
  push:
    branches: [codex/katheko-v2-ios-validation]
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build native iPhone and iPad app
        run: xcodebuild -project ios/KathekoV2.xcodeproj -scheme KathekoV2 -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: KathekoV2-Simulator
          path: build/Build/Products/Debug-iphonesimulator/KathekoV2.app
